<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тимур Бобожанов</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    color: white;

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    position: relative;

    transition: background-image 1s ease;
}

/* Затемнение фотографии */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.48);

    z-index: -1;
}


/* Основная карточка */

.card {

    width: 100%;

    max-width: 430px;

    padding: 35px 22px 25px;

    text-align: center;

    border-radius: 30px;

    background: rgba(0, 0, 0, 0.38);

    border: 1px solid rgba(255,255,255,0.20);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    box-shadow:

        0 25px 80px rgba(0,0,0,0.55);

}


/* Аватар */

.avatar {

    width: 105px;

    height: 105px;

    margin: 0 auto 18px;

    border-radius: 50%;

    overflow: hidden;

    border: 3px solid rgba(255,255,255,0.8);

    box-shadow:

        0 8px 30px rgba(0,0,0,0.5);
}


.avatar img 

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* Имя */

h1 {

    font-size: 28px;

    margin-bottom: 8px;

    letter-spacing: -0.5px;
}


.subtitle {

    color: rgba(255,255,255,0.7);

    font-size: 14px;

    margin-bottom: 28px;
}


/* Кнопки */

.links {

    display: grid;

    gap: 13px;
}


.link {

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 17px 18px;

    border-radius: 18px;

    text-decoration: none;

    color: white;

    background: rgba(255,255,255,0.12);

    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(10px);

    transition: 0.25s;
}


.link:hover {

    transform: translateY(-3px);

    background: rgba(255,255,255,0.20);
}


.icon {

    width: 35px;

    font-size: 25px;

    text-align: center;
}


.text {

    text-align: left;
}


.title {

    font-size: 16px;

    font-weight: bold;
}


.description {

    color: rgba(255,255,255,0.65);

    font-size: 12px;

    margin-top: 3px;
}


.footer {

    margin-top: 25px;

    font-size: 11px;

    color: rgba(255,255,255,0.5);
}

</style>

</head>


<body>


<div class="card">



    <div class="avatar">

 

    </div>


    <!-- ИМЯ -->

    <h1>
        Тимур Бобожанов
    </h1>

    <div class="links">
        
        <br>


        <!-- INSTAGRAM -->

        <a
            class="link"
            href="https://instagram.com/bobojanov_t"
            target="_blank"
        >

            <div class="icon">
                📸
            </div>

            <div class="text">

                <div class="title">
                    Instagram
                </div>

                <div class="description">
                    @bobojanov_t
                </div>

            </div>

        </a>


        <!-- TELEGRAM -->

        <a
            class="link"
            href="https://t.me/bobojanov_t"
            target="_blank"
        >

            <div class="icon">
                ✈️
            </div>

            <div class="text">

                <div class="title">
                    Telegram
                </div>

                <div class="description">
                    @bobojanov_t
                </div>

            </div>

        </a>


        <!-- ТЕЛЕФОН -->

        <a
            class="link"
            href="tel:+998772052522"
        >

            <div class="icon">
                📞
            </div>

            <div class="text">

                <div class="title">
                    Позвонить
                </div>

                <div class="description">+998 77 205 25 22
                </div>

            </div>

        </a>



        </a>


    </div>


    <div class="footer">

        Timur Bobojanov • Contacts

    </div>


</div>



<script>

/*
    Фотографии для фона.

    Ты можешь заменить эти ссылки
    на свои фотографии.
*/

const backgrounds = [

    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",

    "https://images.unsplash.com/photo-1501785888041-af3ef285b470",

    "https://images.unsplash.com/photo-1470770841072-f978cf4d019e",

    "https://images.unsplash.com/photo-1441974231531-c6227db76b6e",

    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"

];


/*
    Выбираем случайную картинку
*/

const random =
    Math.floor(Math.random() * backgrounds.length);


/*
    Ставим её на фон
*/

document.body.style.backgroundImage =
    "url('" + backgrounds[random] + "')";


</script>


</body>
</html>
