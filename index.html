<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тимур Бобожанов</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: white;

            background:
                radial-gradient(circle at 20% 10%, #303044 0%, transparent 35%),
                radial-gradient(circle at 90% 90%, #18243a 0%, transparent 35%),
                #08080c;
        }

        .card {
            width: 100%;
            max-width: 420px;

            padding: 35px 22px 25px;

            text-align: center;

            border-radius: 30px;

            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 100px;
            height: 100px;

            margin: 0 auto 18px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: 800;

            color: #111;

            background: linear-gradient(
                135deg,
                #ffffff,
                #888894
            );

            box-shadow:
                0 10px 35px rgba(255,255,255,0.15);
        }

        h1 {
            font-size: 28px;
            letter-spacing: -0.7px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 28px;

            color: #999;
            font-size: 14px;
        }

        .links {
            display: grid;
            gap: 13px;
        }

        .link {
            display: flex;
            align-items: center;

            gap: 15px;

            padding: 17px 18px;

            text-decoration: none;
            color: white;

            border-radius: 18px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.08);

            transition: 0.2s;
        }

        .link:hover {
            transform: translateY(-2px);

            background: rgba(255,255,255,0.15);
        }

        .icon {
            width: 30px;

            font-size: 23px;

            text-align: center;
        }

        .text {
            text-align: left;
        }

        .title {
            font-size: 16px;
            font-weight: 650;
        }

        .description {
            margin-top: 3px;

            color: #999;

            font-size: 12px;
        }

        .footer {
            margin-top: 25px;

            color: #666;

            font-size: 11px;
        }
    </style>
</head>

<body>
