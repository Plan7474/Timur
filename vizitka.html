<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Правильное отображение на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Тимур Бабажанов</title>

    <!-- Иконки Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;

            background-image:
                linear-gradient(
                    135deg,
                    rgba(0, 0, 0, 0.68),
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.72)
                ),
                url("https://picsum.photos/seed/background1/1600/2400");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;

            transition: background-image 0.8s ease;
        }


        /* Размытый дополнительный слой */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 0, 128, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 170, 255, 0.20),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* Главный контейнер */

        .card {
            width: min(92%, 430px);

            padding: 35px 22px 28px;

            text-align: center;

            position: relative;
            z-index: 2;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            animation: appear 0.8s ease;
        }


        /* Анимация появления */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Круглая картинка */

        .profile {
            width: 115px;
            height: 115px;

            margin: 0 auto 18px;

            border-radius: 50%;

            padding: 4px;

            background:
                linear-gradient(
                    135deg,
                    #ff0080,
                    #7928ca,
                    #00c6ff,
                    #00f2a6
                );

            box-shadow:
                0 0 35px rgba(255, 0, 150, 0.45);

            animation: profileFloat 4s ease-in-out infinite;
        }


        @keyframes profileFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        .profile img {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 3px solid rgba(255, 255, 255, 0.85);
        }


        /* Имя */

        h1 {
            font-size: 27px;
            font-weight: 700;

            letter-spacing: 0.2px;margin-bottom: 7px;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.35);
        }


        .subtitle {
            font-size: 14px;

            color: rgba(255, 255, 255, 0.78);

            margin-bottom: 25px;
        }


        /* Кнопки */

        .links {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }


        .link {
            width: 100%;

            min-height: 58px;

            display: flex;
            align-items: center;

            text-decoration: none;

            color: white;

            border-radius: 17px;

            padding: 0 18px;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .link:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.21);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);
        }


        .link:active {
            transform: scale(0.97);
        }


        /* Иконка */

        .icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            margin-right: 14px;

            background: rgba(255, 255, 255, 0.15);

            font-size: 20px;

            flex-shrink: 0;
        }


        .text {
            flex: 1;

            text-align: left;

            font-size: 16px;

            font-weight: 600;
        }


        .arrow {
            opacity: 0.65;

            font-size: 14px;
        }


        /* Цвета иконок */

        .instagram .icon {
            background:
                linear-gradient(
                    135deg,
                    #833ab4,
                    #fd1d1d,
                    #fcb045
                );
        }


        .telegram .icon {
            background: #229ED9;
        }


        .phone .icon {
            background: #19b95a;
        }


        .message .icon {
            background: #007aff;
        }


        /* Нижняя подпись */

        .footer {
            margin-top: 22px;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.55);

            letter-spacing: 0.5px;
        }


        /* Для маленьких экранов */

        @media (max-height: 700px) {

            .card {
                padding-top: 25px;
                padding-bottom: 20px;
            }

            .profile {
                width: 90px;
                height: 90px;

                margin-bottom: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .subtitle {
                margin-bottom: 17px;
            }

            .link {
                min-height: 52px;
            }

            .icon {
                width: 36px;
                height: 36px;
            }
        }

    </style>
</head>


<body>


    <main class="card">


        <!-- КРУГЛАЯ КАРТИНКА -->

        <div class="profile">
            <img
                id="profileImage"
                src="https://picsum.photos/seed/profile1/300/300"
                alt="Timur">
        </div>


        <!-- ИМЯ -->

        <h1>Тимур Бобожанов</h1>

        <div class="subtitle">
            Мои контакты
        </div>


        <!-- КНОПКИ -->

        <div class="links">


            <!-- INSTAGRAM -->

            <a
                class="link instagram"
                href="https://instagram.com/bobojanov_t"
                target="_blank"
                rel="noopener noreferrer">

                <span class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </span>

                <span class="text">
                    Instagram
                </span><span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- TELEGRAM -->

            <a
                class="link telegram"
                href="https://t.me/bobojanov_t"
                target="_blank"
                rel="noopener noreferrer">

                <span class="icon">
                    <i class="fa-brands fa-telegram"></i>
                </span>

                <span class="text">
                    Telegram
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- ПОЗВОНИТЬ -->

            <a
                class="link phone"
                href="tel:+998772052522">

                <span class="icon">
                    <i class="fa-solid fa-phone"></i>
                </span>

                <span class="text">
                    Позвонить
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- НАПИСАТЬ -->

            <a
                class="link message"
                href="sms:+998772052522">

                <span class="icon">
                    <i class="fa-solid fa-comment"></i>
                </span>

                <span class="text">
                    Написать сообщение
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


        </div>


        <div class="footer">
            Digital contact card
        </div>


    </main>


    <script>

        /*
         * Меняем фон при каждом открытии страницы.
         * randomValue не даёт браузеру использовать
         * старую закэшированную картинку.
         */

        const randomValue =
            Math.floor(Math.random() * 1000000);

        document.body.style.backgroundImage =
            `
            linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.68),
                rgba(0, 0, 0, 0.35),
                rgba(0, 0, 0, 0.72)
            ),
            url("https://picsum.photos/seed/${randomValue}/1600/2400")
            `;


        /*
         * Меняем картинку в верхнем кружке.
         */

        const profileRandom =
            Math.floor(Math.random() * 1000000);

        document.getElementById("profileImage").src =
            https://picsum.photos/seed/profile${profileRandom}/400/400;

    </script>


</body>
</html>
